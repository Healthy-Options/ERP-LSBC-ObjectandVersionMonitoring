name: Dev-tool Object Sync

on:
  schedule:
    # Cron is UTC only and does not adjust for DST. 16:30 UTC = 12:30 AM
    # Philippine Time (UTC+8) — offset 30 min from the BC Extension Snapshot
    # job so the two don't start at the exact same minute. Edit directly in
    # GitHub if your target timezone changes.
    - cron: '30 16 * * *'
  workflow_dispatch: {}

# Without this, clicking "Run Sync Now" more than once (or a manual run
# landing mid-schedule) lets multiple runs execute at the same time, all
# racing to push dev-tool-data.json back to the repo — which is exactly
# what kept rejecting the push even with retries. Same group name as the
# BC Extension Snapshot workflow, on purpose: that workflow also commits
# to this same repo/branch, so without sharing the group the two could
# still collide with each other even though neither collides with
# itself anymore. Sharing the group queues them against each other too.
concurrency:
  group: bcovc-repo-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run Dev-tool sync
        env:
          AL_SOURCE_PAT: ${{ secrets.AL_SOURCE_PAT }}
        run: node scripts/run-dev-tool-sync.js

      - name: Commit updated sync data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-tool-data.json 2>/dev/null || { echo "dev-tool-data.json not present — nothing to commit."; exit 0; }
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Dev-tool sync ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # Something else (a manual re-run, or another workflow like the BC
          # Extension Snapshot) can land a commit on this branch between the
          # checkout above and this push. Retry with a rebase instead of
          # failing outright — this local commit only ever touches
          # dev-tool-data.json, so rebasing onto whatever else landed is safe.
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i) — pulling and retrying..."
            git pull --rebase origin ${{ github.ref_name }}
            sleep $((RANDOM % 5 + 1))
          done
