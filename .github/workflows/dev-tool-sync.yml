name: Dev-tool Object Sync

on:
  schedule:
    # Cron is UTC only and does not adjust for DST. 16:30 UTC = 12:30 AM
    # Philippine Time (UTC+8) — offset 30 min from the BC Extension Snapshot
    # job so the two don't start at the exact same minute. Edit directly in
    # GitHub if your target timezone changes.
    - cron: '30 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run Dev-tool sync
        env:
          AL_SOURCE_PAT: ${{ secrets.AL_SOURCE_PAT }}
        run: node scripts/run-dev-tool-sync.js

      - name: Commit updated sync data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-tool-data.json 2>/dev/null || { echo "dev-tool-data.json not present — nothing to commit."; exit 0; }
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Dev-tool sync ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
